---
kind: auto.CI
spec:
  compileGHWorkflowsOnly: true
---
kind: common.Repository
spec:
  mainBranch: ci
  enableConform: true
---
kind: common.GHWorkflow
spec:
  workflowOptions:
    on:
      pull_request:
        branches:
          - ci
      workflow_dispatch:
        inputs:
          stagex_git_ref:
            description: "StageX git ref to checkout (branch, tag, sha). Leave empty to use the STAGEX_REF pinned in the Makefile."
            required: false
  jobs:
    - name: default
      timeoutMinutes: 720
      buildxOptions:
        enabled: false
      runnerGroup: ubuntu-latest
      steps:
        - name: Set up QEMU
          nonMakeStep: true
          command: docker run --rm --privileged tonistiigi/binfmt --install riscv64
        - name: Set up Docker Buildx
          nonMakeStep: true
          command: docker buildx create --use --name stagex-amd64 --driver docker-container
        - name: Clone stagex
          command: clone
          environment:
            STAGEX_REF: &stagex_ref ${{ inputs.stagex_git_ref }}
        - name: Patch stagex
          command: patch
        - name: login-to-registry
          conditions:
            - except-pull-request
          registryLoginStep:
            registry: ghcr.io
        # Seed the fetch cache from the public ghcr.io image so the build skips
        # most upstream source downloads (and survives flaky GNU mirrors).
        - name: Seed fetch cache
          command: fetch-seed
          environment:
            STAGEX_REF: *stagex_ref
        - name: stage0
          command: stage0
          environment: &build_env
            PROGRESS: plain
            REGISTRY_USERNAME: "${{ github.event_name != 'pull_request' && 'ghcr.io' || 'registry.dev.siderolabs.io' }}/${{ github.repository_owner }}/stagex"
            STAGEX_REF: *stagex_ref
            CROSS_BUILDER_NAME: stagex-amd64
        - name: stage1
          command: stage1
          environment: *build_env
        - name: stage2
          command: stage2
          environment: *build_env
        - name: stage3
          command: stage3
          environment: *build_env
        # The core packages are built as a single step: the Makefile builds the
        # full dependency closure in topological order (each registry-* build
        # pulls its dependencies from the registry).
        - name: core
          command: core
          environment: *build_env
